```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Document Translator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>🌐 Document Translator</h1>
        <p>Translate your documents using cloud computing.</p>

        <form id="translatorForm">

            <label for="document">Upload a Text Document</label>
            <input type="file" id="document" accept=".txt" required>

            <label for="sourceLanguage">Source Language</label>
            <select id="sourceLanguage">
                <option value="en">English</option>
                <option value="te">Telugu</option>
                <option value="hi">Hindi</option>
                <option value="ta">Tamil</option>
                <option value="fr">French</option>
                <option value="es">Spanish</option>
            </select>

            <label for="targetLanguage">Target Language</label>
            <select id="targetLanguage">
                <option value="te">Telugu</option>
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="ta">Tamil</option>
                <option value="fr">French</option>
                <option value="es">Spanish</option>
            </select>

            <button type="submit" id="translateButton">
                Translate Document
            </button>

        </form>

        <div id="status"></div>

        <div id="resultSection" hidden>
            <h3>Translated Document</h3>
            <textarea id="translatedText" rows="8" readonly></textarea>
            <button type="button" id="downloadButton">
                Download Translated File
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
```
